<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F8FF"/>
      <stop offset="100%" stop-color="#E1F1FF"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- 右上装饰圆环 -->
  <circle cx="1200" cy="80" r="150" fill="none" stroke="#BFDBFE" stroke-width="2" opacity="0.45"/>
  <circle cx="1200" cy="80" r="130" fill="none" stroke="#DBEAFE" stroke-width="1.5" opacity="0.7" stroke-dasharray="6 10"/>
  <circle cx="1200" cy="80" r="92" fill="none" stroke="#E2EFFA" stroke-width="1" opacity="0.8"/>

  <!-- 左下装饰圆环 -->
  <circle cx="48" cy="352" r="84" fill="none" stroke="#BFDBFE" stroke-width="1.5" opacity="0.35"/>
  <circle cx="48" cy="352" r="52" fill="none" stroke="#DBEAFE" stroke-width="1.2" opacity="0.6" stroke-dasharray="2 8"/>

  <!-- 左侧图标卡 -->
  <rect x="70" y="90" width="330" height="220" rx="28" fill="url(#box)" stroke="#C7DCFA" stroke-width="1.5"/>
  <circle cx="98" cy="114" r="6" fill="#93C5FD" opacity="0.6"/>
  <rect x="370" y="284" width="12" height="12" rx="3" fill="#BFDBFE" opacity="0.5"/>

  <!-- 云图标 -->
  <g transform="translate(235,168) scale(3.1) translate(-12,-12)" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
  </g>

  <!-- 显示器图标 -->
  <g transform="translate(235,268) scale(2.7) translate(-12,-12)" fill="none" stroke="#38BDF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <line x1="8" y1="21" x2="16" y2="21"/>
    <line x1="12" y1="17" x2="12" y2="21"/>
  </g>

  <!-- 标题区 -->
  <rect x="462" y="140" width="96" height="6" rx="3" fill="url(#title)"/>
  <text x="462" y="196" font-size="52" font-weight="700" fill="url(#title)">天翼云电脑保活自动化</text>
  <text x="464" y="244" font-size="22" fill="#64748B">自动保活 · AI 对话 · 挂机攒积分 · 自动兑换 · Web 管理面板</text>
  <text x="464" y="290" font-size="18" fill="#94A3B8">Docker 双架构一键部署 · Windows 免 Docker 绿色版 · 全部配置浏览器完成</text>

  <!-- 右侧徽章 -->
  <g font-size="17" font-weight="600" fill="#0369A1">
    <rect x="1005" y="108" width="200" height="52" rx="26" fill="#EFF6FF" stroke="#B7D9FB" stroke-width="1.5"/>
    <circle cx="1042" cy="134" r="5" fill="#3B82F6"/>
    <text x="1060" y="140">Docker · amd64 &amp; arm64</text>

    <rect x="1005" y="178" width="200" height="52" rx="26" fill="#EFF6FF" stroke="#B7D9FB" stroke-width="1.5"/>
    <circle cx="1042" cy="204" r="5" fill="#38BDF8"/>
    <text x="1060" y="210">Windows 免 Docker 绿色版</text>

    <rect x="1005" y="248" width="200" height="52" rx="26" fill="#EFF6FF" stroke="#B7D9FB" stroke-width="1.5"/>
    <circle cx="1042" cy="274" r="5" fill="#0EA5E9"/>
    <text x="1060" y="280">MIT License · 开源免费</text>
  </g>

  <!-- 右下角仓库地址 -->
  <text x="1240" y="338" font-size="15" fill="#8CA3C3" text-anchor="end">github.com/likz0421/ctyun-auto-sign</text>
</svg>